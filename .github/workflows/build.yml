name: Build MarkItDown

# Run this build whenever you publish a release tag (e.g. v1.0.0),
# or trigger it manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------
  #  macOS build  ->  MarkItDown.dmg
  # ----------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "markitdown[all]" pywebview pyinstaller

      - name: Build .app
        run: |
          pyinstaller \
            --name "MarkItDown" \
            --windowed \
            --noconfirm \
            --clean \
            --collect-all markitdown \
            --collect-all markitdown_converters \
            --collect-all magika \
            --collect-all onnxruntime \
            --collect-data magika \
            --hidden-import webview.platforms.cocoa \
            markitdown_app.py

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - "dist/MarkItDown.app"

      - name: Create DMG
        run: |
          hdiutil create -volname "MarkItDown" \
            -srcfolder "dist/MarkItDown.app" \
            -ov -format UDZO "MarkItDown.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: MarkItDown-macOS
          path: MarkItDown.dmg

  # ----------------------------------------------------------
  #  Windows build  ->  MarkItDown.exe
  # ----------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "markitdown[all]" pywebview pyinstaller

      - name: Build .exe
        run: |
          pyinstaller --name "MarkItDown" --windowed --noconfirm --clean --onefile --collect-all markitdown --collect-all markitdown_converters --collect-all magika --collect-all onnxruntime --collect-data magika --hidden-import webview.platforms.edgechromium markitdown_app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MarkItDown-Windows
          path: dist/MarkItDown.exe
