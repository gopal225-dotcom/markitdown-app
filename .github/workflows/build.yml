name: Build MarkItDown

# Run this build whenever you publish a release tag (e.g. v1.0.0),
# or trigger it manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Needed so the workflow can create/attach files to a Release.
permissions:
  contents: write

jobs:
  # ----------------------------------------------------------
  #  macOS build  ->  MarkItDown.dmg
  # ----------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "markitdown[all]" pywebview pyinstaller

      - name: Build .app
        run: |
          pyinstaller \
            --name "MarkItDown" \
            --windowed \
            --noconfirm \
            --clean \
            --collect-all markitdown \
            --collect-all markitdown_converters \
            --collect-all magika \
            --collect-all onnxruntime \
            --collect-data magika \
            --hidden-import webview.platforms.cocoa \
            markitdown_app.py

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - "dist/MarkItDown.app"

      - name: Create DMG
        run: |
          hdiutil create -volname "MarkItDown" \
            -srcfolder "dist/MarkItDown.app" \
            -ov -format UDZO "MarkItDown.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: MarkItDown-macOS
          path: MarkItDown.dmg

      # When triggered by a version tag, attach the DMG to the GitHub Release.
      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MarkItDown.dmg

  # ----------------------------------------------------------
  #  Windows build  ->  MarkItDown.exe
  # ----------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "markitdown[all]" pywebview pyinstaller

      - name: Build .exe
        run: |
          pyinstaller --name "MarkItDown" --windowed --noconfirm --clean --onefile --collect-all markitdown --collect-all markitdown_converters --collect-all magika --collect-all onnxruntime --collect-data magika --hidden-import webview.platforms.edgechromium markitdown_app.py

      # Smoke test 1: confirm the core dependencies import and MarkItDown
      # initializes inside a frozen build. Catches missing-module / packaging
      # failures (the most common .exe breakage) without needing a GUI.
      - name: Smoke test - dependency import
        shell: cmd
        run: |
          echo import sys > smoke.py
          echo print("python", sys.version) >> smoke.py
          echo from markitdown import MarkItDown >> smoke.py
          echo import webview >> smoke.py
          echo md = MarkItDown(enable_plugins=False) >> smoke.py
          echo print("OK: imports and MarkItDown init succeeded") >> smoke.py
          python smoke.py

      # Smoke test 2: launch the actual .exe briefly. A windowed app won't
      # exit on its own, so we start it, wait, and confirm the process is
      # alive (i.e. it didn't crash on startup), then terminate it.
      - name: Smoke test - launch exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/MarkItDown.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Error "App exited early (exit code $($p.ExitCode)) - likely a startup crash."
            exit 1
          } else {
            Write-Host "OK: app still running after 15s - no startup crash."
            Stop-Process -Id $p.Id -Force
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MarkItDown-Windows
          path: dist/MarkItDown.exe

      # When triggered by a version tag, attach the EXE to the GitHub Release.
      - name: Attach EXE to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MarkItDown.exe
